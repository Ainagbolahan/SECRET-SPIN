<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin the Wheel</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:20px;text-align:center;background:#f6f5f1;color:#222}
  h1{font-size:1.4rem;margin:8px 0}
  .stage{position:relative;width:min(92vw,420px);margin:16px auto}
  canvas{width:100%;height:auto;transition:transform 5s cubic-bezier(.1,.7,.1,1)}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #c0392b;z-index:2}
  button{font-size:1.1rem;padding:12px 32px;border:0;border-radius:10px;background:#1f6feb;color:#fff;cursor:pointer}
  button:disabled{background:#999;cursor:default}
  #result{font-size:1.6rem;font-weight:700;margin-top:18px;min-height:2em}
  #msg{color:#c0392b;margin-top:10px}
</style>
</head>
<body>
<h1 id="hello">Loading…</h1>
<div class="stage"><div class="pointer"></div><canvas id="wheel" width="600" height="600"></canvas></div>
<button id="spinBtn" disabled>SPIN</button>
<div id="result"></div>
<div id="msg"></div>
<script>
const id = location.pathname.split('/').pop();
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('spinBtn');
const resultEl = document.getElementById('result');
const msgEl = document.getElementById('msg');
let names = [];
let currentRotation = 0;
const COLORS = ['#e74c3c','#f39c12','#27ae60','#2980b9','#8e44ad','#16a085','#d35400','#2c3e50'];

function drawWheel() {
  const n = names.length, seg = 2 * Math.PI / n, c = 300;
  ctx.clearRect(0, 0, 600, 600);
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * seg;
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, 290, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    ctx.save();
    ctx.translate(c, c); ctx.rotate(a0 + seg / 2);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
    ctx.font = Math.max(8, Math.min(22, 600 / n)) + 'px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(names[i].slice(0, 18), 275, 0);
    ctx.restore();
  }
}

function animateTo(result) {
  const i = names.indexOf(result), seg = 360 / names.length;
  const target = 360 * 6 - (i + 0.5) * seg;
  currentRotation = target;
  canvas.style.transform = 'rotate(' + target + 'deg)';
  return new Promise(r => setTimeout(r, 5200));
}

async function init() {
  try {
    const r = await fetch('/api/me/' + id);
    if (!r.ok) throw new Error('This link is not valid.');
    const d = await r.json();
    names = d.wheelNames;
    document.getElementById('hello').textContent = 'Hello, ' + d.name;
    drawWheel();
    if (d.result) {
      resultEl.textContent = 'You picked: ' + d.result;
      btn.textContent = 'Already spun';
    } else {
      btn.disabled = false;
    }
  } catch (e) {
    document.getElementById('hello').textContent = e.message;
    btn.style.display = 'none';
  }
}

btn.onclick = async () => {
  btn.disabled = true; msgEl.textContent = '';
  try {
    const r = await fetch('/api/spin/' + id, { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Something went wrong');
    if (!d.already) await animateTo(d.result);
    resultEl.textContent = 'You picked: ' + d.result;
    btn.textContent = 'Already spun';
  } catch (e) {
    msgEl.textContent = e.message;
    btn.disabled = false;
  }
};
init();
</script>
</body>
</html>
