<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Spin</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { font-size: 1.8rem; margin-bottom: 6px; font-weight: 700; }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      margin-bottom: 20px;
    }

    .login-card label { display: block; text-align: left; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .login-card input[type="email"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      margin-bottom: 16px;
    }
    .login-card input[type="email"]:focus { border-color: var(--primary); }

    .wheel-section {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin-bottom: 24px;
    }

    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid var(--danger);
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.25), 0 0 0 8px var(--panel-border);
    }

    button.btn-main {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      width: 100%;
    }

    button.btn-main:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    button.btn-main:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.7;
    }

    .result-card {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 20px 24px;
      width: 100%;
      display: none;
    }

    .result-card h3 { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .result-card .recipient-name { font-size: 1.6rem; font-weight: 800; color: var(--accent); word-break: break-all; }

    .notice-card {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--panel-border);
      color: #fcd34d;
      padding: 14px 18px;
      border-radius: var(--radius);
      margin-top: 16px;
      display: none;
      width: 100%;
      font-size: 0.9rem;
    }

    .error-card {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 14px 18px;
      border-radius: var(--radius);
      margin-top: 16px;
      display: none;
      width: 100%;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Secret Spin</h1>
    <p class="subtitle">Enter your email to join the Secret Santa spin!</p>

    <!-- Email Input Card -->
    <div class="login-card" id="loginCard">
      <label for="userEmail">Participant Email Address</label>
      <input type="email" id="userEmail" placeholder="your.name@domain.com" autocomplete="email">
      <button class="btn-main" onclick="verifyEmail()">Continue to Spin</button>
    </div>

    <!-- Spin Wheel Section (Unlocked after email verification) -->
    <div class="wheel-section" id="wheelSection">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
      </div>

      <button id="spinBtn" class="btn-main" onclick="spinWheel()">SPIN THE WHEEL</button>
    </div>

    <div id="noticeCard" class="notice-card">🔒 Spinning is locked by the admin host. Please wait for the event to open.</div>
    <div id="resultCard" class="result-card">
      <h3>You are Secret Santa for:</h3>
      <div id="recipientName" class="recipient-name">---</div>
    </div>
    <div id="errorCard" class="error-card"></div>
  </div>

  <script>
    const COLORS = [
      '#4f46e5', '#0d9488', '#d97706', '#dc2626',
      '#2563eb', '#059669', '#7c3aed', '#db2777',
      '#0284c7', '#16a34a', '#ea580c', '#9333ea'
    ];

    let verifiedEmail = '';
    let wheelNames = [];
    let currentAngle = 0;
    let isSpinning = false;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    async function verifyEmail() {
      const emailInput = document.getElementById('userEmail').value.trim();
      hideError();

      if (!emailInput) return showError('Please enter your email address.');

      try {
        const res = await fetch('/api/check-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Email verification failed.');

        verifiedEmail = data.email;
        wheelNames = data.wheelNames || [];

        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('wheelSection').style.display = 'flex';

        drawWheel(currentAngle);

        if (!data.isApproved && !data.alreadySpun) {
          document.getElementById('spinBtn').disabled = true;
          document.getElementById('noticeCard').style.display = 'block';
        }

        if (data.alreadySpun) {
          showResult(data.result);
          document.getElementById('spinBtn').innerText = 'ALREADY SPUN';
          document.getElementById('spinBtn').disabled = true;
          alignWheelToResult(data.result);
        }
      } catch (err) {
        showError(err.message);
      }
    }

    function drawWheel(angle) {
      const numSegments = wheelNames.length;
      if (numSegments === 0) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;
      const sliceAngle = (2 * Math.PI) / numSegments;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSegments; i++) {
        const startAngle = angle + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px system-ui, sans-serif';
        const label = wheelNames[i].split('@')[0];
        ctx.fillText(label, radius - 20, 6);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(centerX, centerY, 40, 0, 2 * Math.PI);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#6366f1';
      ctx.stroke();
    }

    async function spinWheel() {
      if (isSpinning || !verifiedEmail) return;

      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;
      spinBtn.innerText = 'SPINNING...';
      isSpinning = true;

      try {
        const res = await fetch('/api/spin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: verifiedEmail })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed to spin');

        const winnerEmail = data.result;
        animateSpinToWinner(winnerEmail, () => {
          showResult(winnerEmail);
          spinBtn.innerText = 'SPUN!';
          isSpinning = false;
        });
      } catch (err) {
        showError(err.message);
        spinBtn.disabled = false;
        spinBtn.innerText = 'TRY AGAIN';
        isSpinning = false;
      }
    }

    function animateSpinToWinner(winnerEmail, onComplete) {
      const targetIndex = wheelNames.indexOf(winnerEmail);
      if (targetIndex === -1) return onComplete();

      const numSegments = wheelNames.length;
      const sliceAngle = (2 * Math.PI) / numSegments;
      const targetSliceCenter = targetIndex * sliceAngle + sliceAngle / 2;
      let targetAngle = (3 * Math.PI / 2) - targetSliceCenter;

      const extraRotations = 5 * 2 * Math.PI;
      const startAngle = currentAngle % (2 * Math.PI);
      const finalAngle = startAngle + extraRotations + ((targetAngle - startAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);

      const duration = 4500;
      const startTime = performance.now();

      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

      function loop(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        currentAngle = startAngle + (finalAngle - startAngle) * easeOutCubic(progress);
        drawWheel(currentAngle);

        if (progress < 1) {
          requestAnimationFrame(loop);
        } else {
          currentAngle = finalAngle;
          onComplete();
        }
      }

      requestAnimationFrame(loop);
    }

    function alignWheelToResult(winnerEmail) {
      const targetIndex = wheelNames.indexOf(winnerEmail);
      if (targetIndex === -1) return;
      const numSegments = wheelNames.length;
      const sliceAngle = (2 * Math.PI) / numSegments;
      const targetSliceCenter = targetIndex * sliceAngle + sliceAngle / 2;
      currentAngle = (3 * Math.PI / 2) - targetSliceCenter;
      drawWheel(currentAngle);
    }

    function showResult(email) {
      document.getElementById('recipientName').innerText = email;
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('noticeCard').style.display = 'none';
    }

    function showError(msg) {
      const errCard = document.getElementById('errorCard');
      errCard.innerText = msg;
      errCard.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorCard').style.display = 'none';
    }
  </script>
</body>
</html>
